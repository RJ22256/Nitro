name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (64-bit)
        run: cmake -S . -B build -A x64

      - name: Build (64-bit)
        run: cmake --build build --config Release

      - name: Configure (32-bit)
        run: cmake -S . -B build32 -A Win32

      - name: Build (32-bit)
        run: cmake --build build32 --config Release

      - name: Package
        shell: pwsh
        run: |
          $pkg = "package/Nitro"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item build/dist/Nitro.exe, build/dist/NitroHook.dll, build/dist/NitroVk.dll, build/dist/NitroVk.json $pkg
          Copy-Item build32/dist/NitroHook32.dll, build32/dist/NitroVk32.dll, build32/dist/NitroVk32.json, build32/dist/NitroInject32.exe $pkg
          # Symbols, so crash reports in Nitro.log name Nitro's functions
          Copy-Item build/dist/NitroHook.pdb, build/dist/NitroVk.pdb, build32/dist/NitroHook32.pdb, build32/dist/NitroVk32.pdb $pkg
          Copy-Item README.md, THIRD_PARTY_NOTICES.md $pkg
          New-Item -ItemType Directory -Force "$pkg/Fonts" | Out-Null
          Copy-Item fonts/* "$pkg/Fonts"
          Compress-Archive -Path $pkg -DestinationPath package/Nitro-x64.zip -Force

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Null
          }
          $ver = "0.2.0"
          $ref = "${{ github.event.release.tag_name || github.ref_name }}"
          if ($ref -match '^v(\d+(\.\d+){0,3})') { $ver = $ref.Substring(1) }
          $nums = ([regex]::Match($ver, '^\d+(\.\d+){0,3}').Value).Split('.')
          while ($nums.Count -lt 4) { $nums += '0' }
          $numeric = ($nums[0..3] -join '.')
          & $iscc /Qp "/DAppVersion=$ver" "/DNumericVersion=$numeric" installer/Nitro.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item package/Nitro-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Nitro-Setup
          path: package/Nitro-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Nitro-x64
          path: package/Nitro/

      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag package/Nitro-Setup.exe package/Nitro-x64.zip --clobber
          } else {
            gh release create $tag package/Nitro-Setup.exe package/Nitro-x64.zip --title "Nitro $tag" --notes-file .github/RELEASE_NOTES.md --prerelease
          }
