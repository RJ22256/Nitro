name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $pkg = "package/Nitro"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item build/dist/Nitro.exe, build/dist/NitroHook.dll, build/dist/NitroVk.dll, build/dist/NitroVk.json $pkg
          Copy-Item README.md, THIRD_PARTY_NOTICES.md $pkg
          Compress-Archive -Path $pkg -DestinationPath package/Nitro-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Nitro-x64
          path: package/Nitro/

      - name: Attach to release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag package/Nitro-x64.zip --clobber
          } else {
            gh release create $tag package/Nitro-x64.zip --title "Nitro $tag" --notes-file .github/RELEASE_NOTES.md --prerelease
          }
