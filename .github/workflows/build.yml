name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $pkg = "package/Nitro"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item build/dist/Nitro.exe, build/dist/NitroHook.dll $pkg
          Copy-Item README.md, THIRD_PARTY_NOTICES.md $pkg
          Set-Content "$pkg/PUT Lossless.dll HERE.txt" "Copy Lossless.dll from Steam\steamapps\common\Lossless Scaling\ into this folder, then run Nitro.exe."
          Compress-Archive -Path $pkg -DestinationPath package/Nitro-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Nitro-x64
          path: package/Nitro/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag package/Nitro-x64.zip --clobber
          } else {
            gh release create $tag package/Nitro-x64.zip --title "Nitro $tag" --notes-file .github/RELEASE_NOTES.md --prerelease
          }
