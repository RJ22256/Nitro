<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Nitro</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141A3D"/>
      <stop offset="0.55" stop-color="#1B1240"/>
      <stop offset="1" stop-color="#3A0F57"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.58" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5B3BFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5B3BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="0.5" stop-color="#7A5CFF"/>
      <stop offset="1" stop-color="#FF2E9A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <path id="b" d="M300 52 L128 296 L238 296 L202 460 L384 208 L272 208 Z"/>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#halo)"/>

    <!-- speed streaks -->
    <g stroke="#00F0FF" stroke-linecap="round" opacity="0.35">
      <line x1="40" y1="170" x2="150" y2="170" stroke-width="10"/>
      <line x1="70" y1="352" x2="160" y2="352" stroke-width="10"/>
      <line x1="24" y1="262" x2="96" y2="262" stroke-width="8" opacity="0.7"/>
    </g>

    <!-- generated frames: ghost bolts trailing behind -->
    <g transform="translate(30 0)">
      <use href="#b" transform="translate(-96 0)" fill="#00F0FF" opacity="0.12"/>
      <use href="#b" transform="translate(-64 0)" fill="#00F0FF" opacity="0.22"/>
      <use href="#b" transform="translate(-32 0)" fill="#4FA8FF" opacity="0.38"/>

      <!-- real frame -->
      <use href="#b" fill="#7A5CFF" filter="url(#glow)" opacity="0.9"/>
      <use href="#b" fill="url(#bolt)" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="6" stroke-linejoin="round"/>
      <use href="#b" fill="url(#shine)"/>
    </g>
  </g>
</svg>
